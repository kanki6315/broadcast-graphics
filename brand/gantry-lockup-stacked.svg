<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" role="img" aria-labelledby="title desc">
  <title id="title">Gantry</title>
  <desc id="desc">Stacked Gantry logo with a circular G timing mark above the wordmark.</desc>
  <style>
    @font-face { font-family: "Gantry Display"; src: url("./BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; }
  </style>
  <defs>
    <mask id="gantry-aperture">
      <rect width="256" height="256" fill="black" />
      <circle cx="112" cy="128" r="92" fill="none" stroke="white" stroke-width="42" />
      <rect x="112" y="95" width="144" height="66" fill="black" />
    </mask>
  </defs>
  <g transform="translate(100 20) scale(1.25)">
    <rect width="256" height="256" fill="#15191c" mask="url(#gantry-aperture)" />
    <rect x="112" y="116" width="66" height="24" fill="#15191c" />
    <rect x="188" y="116" width="24" height="24" fill="#ff4b21" />
  </g>
  <text x="260" y="480" text-anchor="middle" fill="#15191c" font-family="Gantry Display, Barlow Condensed, sans-serif" font-size="132" font-weight="700" letter-spacing="9">GANTRY</text>
</svg>
